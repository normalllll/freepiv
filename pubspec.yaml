name: freepiv
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.4.0+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  frost_ui:
    git:
      url: &frost https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: &frost_ref b7ff5aee3c7c86c694126aa32fee9196ba9c25e5
  frost_data:
    git: {url: *frost, path: packages/frost_data, ref: *frost_ref}
  flutter_media_cache:
    git:
      url: https://github.com/normalllll/flutter_media_cache.git
      ref: fd058fbdbc91368e6477df795c596957e95a209f

  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2
  code_assets: ^2.2.0
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.1.4
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  app_links: ^7.2.2
  webview_flutter: ^4.14.1
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  html: ^0.15.7
  file_picker: ^13.3.3
  pasteboard: ^0.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.3
  drift: ^2.35.4
  sqlite3: ^3.9.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_ui: ^1.11.0
  build_runner: ^2.17.1

  freezed: ^4.0.3

  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.3

flutter:

  uses-material-design: true

  assets:
    - assets/icon-512.png
    - assets/fonts/LICENSE-Lucide.txt
    - assets/emojis/
    - assets/stamps/
    - assets/fonts/OFL-NotoSansCJK.txt

  # Subsets built by tool/subset_cjk_fonts.py; SIL OFL 1.1.
  fonts:
    - family: FreepivIcons
      fonts:
        - asset: assets/fonts/FreepivIcons.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Subset.ttf
