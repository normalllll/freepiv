name: freepiv
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 0.0.1+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0-beta.4
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.3.0
  slang: ^4.16.0
  slang_flutter: ^4.16.0
  app_links: ^7.1.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  loading_more_list: ^7.1.0
  pull_to_refresh_notification: ^3.1.1
  waterfall_flow: ^3.1.1
  extended_image: ^10.0.1
  html: ^0.15.6
  toastification: ^3.2.0
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2
  file_picker: ^12.0.0-beta.5
  pasteboard: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.2
  drift: ^2.34.0
  sqlite3: ^3.3.3


dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  go_router_builder: ^4.3.0

  freezed: ^3.2.5

  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.0

