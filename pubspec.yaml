name: freepiv
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 0.2.0+6

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  frost_ui:
    git:
      url: https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: main
  frost_data:
    git:
      url: https://github.com/normalllll/frost_ui.git
      path: packages/frost_data
      ref: main

  cupertino_icons: ^2.0.0
  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2
  code_assets: ^2.1.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.2
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  app_links: ^7.2.2
  webview_flutter: ^4.14.1
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  loading_more_list: ^7.1.0
  pull_to_refresh_notification: ^3.1.1
  waterfall_flow: ^3.1.1
  extended_image: ^10.1.0
  html: ^0.15.7
  skeletonizer: ^3.0.0
  flutter_animate: ^4.5.2
  file_picker: ^13.1.0
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.3
  drift: ^2.35.1
  sqlite3: ^3.7.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  crypto: ^3.0.7


dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  go_router_builder: ^4.5.0

  freezed: ^4.0.2

  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1

flutter:


  uses-material-design: true

  assets:
    - assets/icon-512.png
    - assets/fonts/LICENSE-Lucide.txt
    - assets/emojis/
    - assets/stamps/
    - assets/fonts/OFL-NotoSansCJK.txt

  # Subsets built by tool/subset_cjk_fonts.py; SIL OFL 1.1.
  fonts:
    - family: FreepivIcons
      fonts:
        - asset: assets/fonts/FreepivIcons.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Subset.ttf

# frost_data reaches frost_ui by a path inside the same Git checkout, which pub
# pins to a commit; this keeps both on main. pubspec_overrides.yaml replaces it locally.
dependency_overrides:
  frost_ui:
    git:
      url: https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: main
